[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "iam-policy-guard"
version = "0.1.0"
description = "Access Analyzer gates Terraform IAM changes on PRs; an LLM explains the risk (advisory only)."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "boto3>=1.34",
  "anthropic>=0.40",
  "python-hcl2>=8,<9",  # extract.py depends on the 8.x output shape
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S"]  # S = bandit security rules

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
pythonpath = ["src"]
