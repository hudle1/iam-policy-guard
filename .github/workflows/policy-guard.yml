name: IAM Policy Guard

# `pull_request`, never `pull_request_target`: PR code never runs with base-repo secrets,
# and fork PRs get no OIDC token or secrets.
#
# No `paths` filter on purpose: `guard` is a required status check on main, and a
# path-filtered workflow never reports on PRs outside its paths, which would leave those
# PRs stuck at "Expected — Waiting for status". With no changed .tf files the CLI checks
# nothing, makes no Access Analyzer calls ($0) and passes.
on:
  pull_request:

permissions:
  contents: read
  id-token: write       # OIDC token for AWS
  pull-requests: write  # post the report comment

concurrency:
  group: policy-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  guard:
    # No job-level `if`: a skipped job counts as PASSING for a required status check, so
    # skipping fork PRs would let them merge unchecked. Fork PRs FAIL instead (first step).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Fork PRs get no OIDC token or secrets under `pull_request`, so they can't be checked.
      # Fail closed before checkout: the fork's code is never checked out or run.
      - name: Block fork PRs (fail closed)
        if: github.event.pull_request.head.repo.full_name != github.repository
        env:
          MSG: >-
            Fork PRs can't be checked automatically: no AWS credentials. A maintainer must
            review the IAM changes and re-run from a branch in this repo.
        run: |
          echo "::error title=IAM Policy Guard::$MSG"
          echo "## ❌ IAM Policy Guard: $MSG" >> "$GITHUB_STEP_SUMMARY"
          exit 1

      # TODO: pin every action to a full commit SHA before shipping (Dependabot keeps them updated).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # need the base branch to diff policies
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install .

      - name: Configure AWS credentials (OIDC, no keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}  # secret so the account ID is masked in logs
          aws-region: us-east-1
          role-session-name: policy-guard-pr-${{ github.event.pull_request.number }}

      - name: Run checks
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        # --exclude replaces the default list, so tests/fixtures/ is repeated here.
        # infra/ is the guard's own bootstrap role. Its policies use Terraform references
        # (locals, variables) that static parsing can't resolve, so it would always fail
        # closed. Excluded files are still listed as skipped in the report.
        run: >-
          python -m iam_policy_guard --base "$BASE_SHA" --head "$HEAD_SHA" --report report.md
          --exclude tests/fixtures/ --exclude infra/

      # Verdict = exit code of the step above (Access Analyzer only). The LLM text is advisory.
      # Sticky comment: --create-if-none needs gh >= 2.68.0 (runner ubuntu-24.04 ships 2.103.x).
      # --edit-last edits the newest github-actions[bot] comment, so keep this the only
      # workflow that comments on PRs.
      - name: Comment report on PR
        if: always() && hashFiles('report.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment ${{ github.event.pull_request.number }} --body-file report.md --edit-last --create-if-none
